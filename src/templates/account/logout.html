{% extends "base/base.html" %}

{% block title %}Sign Out — {{ institute_short_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-xl border border-slate-200 shadow-sm text-center">
    <div class="text-3xl mb-3">👋</div>
    <h1 class="text-xl font-bold text-slate-900 mb-2">Sign Out Confirmation</h1>
    <p class="text-sm text-slate-600 mb-6">Are you sure you want to sign out of <strong>{{ institute_name }}</strong> Attendance & Parent Alerts?</p>
    
    <form method="post" action="{% url 'account_logout' %}" class="space-y-3">
        {% csrf_token %}
        <button type="submit" class="w-full py-2.5 px-4 bg-rose-600 hover:bg-rose-500 text-white font-semibold rounded-lg text-sm transition cursor-pointer shadow-sm">
            Yes, Sign Out
        </button>
        <a href="{% url 'reporting:dashboard' %}" class="block w-full py-2 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg text-sm transition">
            Cancel and Return to Dashboard
        </a>
    </form>
</div>
{% endblock %}
